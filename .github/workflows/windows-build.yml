name: Windows Build
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore NovaDesktop/NovaDesktop.csproj -p:Platform=x64
      - name: Build
        run: dotnet build NovaDesktop/NovaDesktop.csproj -c Release -p:Platform=x64 --no-restore
